name: beatport2rss

services:
  postgres:
    image: postgres:latest
    container_name: postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VIRTUAL_HOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  collector:
    build:
      context: ..
      dockerfile: services/collector/src/Beatport2Rss.Collector.Worker/Dockerfile
    container_name: collector
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__CollectorDbContext=${COLLECTOR_DB_CONNECTION}
      - RabbitMqOptions__HostName=${RABBITMQ_HOSTNAME}
      - RabbitMqOptions__Port=${RABBITMQ_PORT}
      - RabbitMqOptions__UserName=${RABBITMQ_USERNAME}
      - RabbitMqOptions__Password=${RABBITMQ_PASSWORD}
      - RabbitMqOptions__VirtualHost=${RABBITMQ_VIRTUAL_HOST}
      - QueueOptions__DeadLetterSuffix=${QUEUE_DEAD_LETTER_SUFFIX}
      - QueueOptions__ExchangeName=${QUEUE_EXCHANGE_NAME}
      - QueueOptions__Queues__SubscriptionCreatedV1=${QUEUE_SUBSCRIPTION_CREATED}
      - QueueOptions__Queues__FeedSubscriptionCreatedV1=${QUEUE_FEED_SUBSCRIPTION_CREATED}
      - QueueOptions__Queues__FeedSubscriptionDeletedV1=${QUEUE_FEED_SUBSCRIPTION_DELETED}
      - QueueOptions__RoutingKeys__SubscriptionCreatedV1=${ROUTING_SUBSCRIPTION_CREATED}
      - QueueOptions__RoutingKeys__FeedSubscriptionCreatedV1=${ROUTING_FEED_SUBSCRIPTION_CREATED}
      - QueueOptions__RoutingKeys__FeedSubscriptionDeletedV1=${ROUTING_FEED_SUBSCRIPTION_DELETED}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  interceptor:
    build:
      context: ..
      dockerfile: services/interceptor/src/Beatport2Rss.Interceptor/Dockerfile
    container_name: interceptor
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kestrel__Endpoints__gRpc__Url=${INTERCEPTOR_GRPC_URI}
      - BeatportCredentials__Username=${BEATPORT_USERNAME}
      - BeatportCredentials__Password=${BEATPORT_PASSWORD}
      - ChromiumDownloaderOptions__BaseAddress=${CHROMIUM_BASE_URL}
    volumes:
      - interceptor-cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: api/src/Beatport2Rss.Api/Dockerfile
    container_name: api
    ports:
      - "${API_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ApiDbContext=${API_DB_CONNECTION}
      - BeatportTokenProviderOptions__TokenInterceptorGrpcUri=${INTERCEPTOR_GRPC_URI}
      - BeatportCredentials__Username=${BEATPORT_USERNAME}
      - BeatportCredentials__Password=${BEATPORT_PASSWORD}
      - RabbitMQOptions__HostName=${RABBITMQ_HOSTNAME}
      - RabbitMQOptions__Port=${RABBITMQ_PORT}
      - RabbitMQOptions__UserName=${RABBITMQ_USERNAME}
      - RabbitMQOptions__Password=${RABBITMQ_PASSWORD}
      - RabbitMQOptions__VirtualHost=${RABBITMQ_VIRTUAL_HOST}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__SigningKey=${JWT_SIGNING_KEY}
      - JwtOptions__ExpiresIn=${JWT_EXPIRES_IN}
      - RefreshTokenOptions__ExpiresIn=${REFRESH_TOKEN_EXPIRES_IN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      interceptor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgresql-data:
  rabbitmq-data:
  interceptor-cache: